<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas</title>
    <link rel="stylesheet" href="../../assets/css/turmas.css">
    <link rel="stylesheet" href="../../assets/css/registro-rapido.css">
    <link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
</head>
<body class="corpo">
    <header class="cabecalho">
        <h1>Turmas</h1>
        <nav aria-label="Opções da conta">
            <button type="button">Notificações</button>
            <button type="button">Perfil</button>
            <button type="button">Ajuda</button>
        </nav>
    </header>

    <div id="aviso-rede" role="status">
        <p style="background-color: aliceblue;">Modo Offline: 2 Registros guardados</p>
    </div>


    <section id="aula-atual">
        <h3>AULA ATUAL (10:00 - 11:40) - 2º Ano Informática</h3>

        <button type="button" id="registro-grupo">Registro em grupo</button>
    </section>

    <div id="estudantes-turma">
        <h3>Estudantes da turma</h3>

        <div id="lista-estudantes">
            <!--javascript pra preencher de alunos-->
        </div>

        <button type="button" id="todos-estudantes">Ver todos os estudantes</button>
    </div>

    <section id="outras-turmas">
        <h2>Outras turmas de hoje</h2>

        <div id="lista-turmas">
            <!--lista adicionada pelo javascript-->
        </div>
    </section>

    <dialog id="modal-registro">
        <header>
            <h2>Registro rápido</h2>

            <button type="button" id="fechar-registro">
                Fechar
            </button>
        </header>
        <div class="cabecalho-estudante-registro">

            <p id="nome-estudante"></p>

            <a id="link-perfil-estudante" class="botao-ver-perfil" href="perfil-estudante.html">
                Ver perfil
            </a>

        </div>

        <section id="selecao-dimensao">

            <h3>Selecione a dimensão atitudinal</h3>

            <div id="lista-dimensoes">
                <button type="button" data-dimensao="responsabilidade">
                    Responsabilidade
                </button>
                
                <button type="button" data-dimensao="colaboracao">
                    Colaboração
                </button>

                <button type="button" data-dimensao="autonomia">
                    Autonomia
                </button>

                <button type="button" data-dimensao="participacao">
                    Participação
                </button>

                <button type="button" data-dimensao="respeito-convivencia">
                    Respeito e Convivência
                </button>
            </div>
        </section>

        <section id="selecao-tipo" hidden>
            <h3>Tipo de registro</h3>

            <div id="tipo-registro">
                <button type="button" data-tipo="avanco">
                    Avanço
                </button>

                <button type="button" data-tipo="ponto-atencao">
                    Ponto de Atenção
                </button>
            </div>
        </section>

        <div id="observacao-registro">
            <label for="nota-registro">
                Observação (opcional)
            </label>

            <textarea name="nota-registro" id="nota-registro"></textarea>
        </div>
    </dialog>


    <div id="confirmacao-registro" role="status" hidden>
        <p>Registro realizado com sucesso!</p>

        <button type="button" id="desfazer-registro">
            Desfazer (5s)
        </button>
    </div>

    <footer id="rodape">
        <a href="turmas.html" class="ativo"> 
            <i class="icon-book-open" aria-hidden="true"></i>
            <span>Turmas</span>
        </a>
        <a href="autoavaliacao.html">
            <i class="icon-pencil" aria-hidden="true"></i>
            <span>Autoavaliação</span>
        </a>
        <a href="dialogos.html">
            <i class="icon-message-circle" aria-hidden="true"></i>
            <span>Diálogos</span>
        </a>
        <a href="registros.html">
            <i class="icon-clipboard-list" aria-hidden="true"></i>
            <span>Registros</span>
        </a>
    </footer>
    
    <script src="../../assets/js/modules/registro-rapido.js"></script>
    <script type="module" src="../../assets/js/modules/professor.js"></script> 
</body>
</html>
